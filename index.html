<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HEADS UP HOLD'EM</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="table-wrap" aria-label="ポーカーテーブル">
      <div class="table-glow"></div>
      <div class="poker-table">
        <section class="seat cpu-seat" aria-label="CPU">
          <div class="seat-row">
            <div class="player-head">
              <div class="avatar cpu-avatar">AI</div>
              <div>
                <div class="name-row"><strong>RIVAL</strong><span id="cpuDealer" class="dealer-chip">D</span></div>
                <span id="cpuStack" class="stack">1,000</span>
              </div>
            </div>
            <div id="cpuCards" class="cards hand"></div>
          </div>
          <div id="cpuStatus" class="status-pill">WAITING</div>
        </section>

        <section class="board-area" aria-label="コミュニティカード">
          <div id="phaseLabel" class="phase-label">READY</div>
          <div id="boardCards" class="cards board"></div>
          <div class="pot-panel">
            <span>POT</span>
            <strong id="potAmount">0</strong>
          </div>
          <p id="message" class="message" aria-live="polite">ディールを押してゲーム開始</p>
        </section>

        <section class="seat player-seat" aria-label="プレイヤー">
          <div class="seat-row">
            <div class="player-head">
              <div class="avatar">YOU</div>
              <div>
                <div class="name-row"><strong>PLAYER</strong><span id="playerDealer" class="dealer-chip">D</span></div>
                <span id="playerStack" class="stack">1,000</span>
              </div>
            </div>
            <div class="hand-col">
              <div id="playerCards" class="cards hand"></div>
              <span id="bestHand" class="best-hand">-</span>
            </div>
          </div>
          <div id="playerStatus" class="status-pill">READY</div>
        </section>
      </div>
    </section>

    <section class="controls" aria-label="操作パネル">
      <div class="raise-control">
        <label for="raiseSlider">レイズ額 <strong id="raiseValue">40</strong></label>
        <input id="raiseSlider" type="range" min="40" max="500" step="10" value="40" />
      </div>
      <div class="bb-presets">
        <button type="button" class="bb-btn" data-bb="1">1BB</button>
        <button type="button" class="bb-btn" data-bb="2">2BB</button>
        <button type="button" class="bb-btn" data-bb="3">3BB</button>
        <button type="button" class="bb-btn" data-bb="4">4BB</button>
      </div>
      <div class="actions">
        <button id="foldBtn" class="action danger" type="button">FOLD</button>
        <button id="checkCallBtn" class="action primary" type="button">CHECK</button>
        <button id="raiseBtn" class="action" type="button">BET 40</button>
        <button id="dealBtn" class="action deal" type="button">DEAL</button>
      </div>
      <div class="legend">
        <span>BLIND 10 / 20</span>
        <span id="handNo">HAND 0</span>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
